name: C

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!playground/**"
      - "!vscode-extension/**"
      - "!.github/**"
      - ".github/workflows/test-c.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node --version
      - run: npm ci
      - run: gcc --version
      - run: EXPRFORGE_TEST_TARGETS=C npm test
