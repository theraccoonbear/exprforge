name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node --version
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # bump deliberately
      - run: python --version
      - run: EXPRFORGE_TEST_TARGETS=Python npm test
