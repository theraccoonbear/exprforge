name: Deploy Playground

# The playground (playground/) is a separate subproject -- own
# package.json, own dependencies, "exprforge": "file:.." linking the
# real library so the live demo always reflects whatever's actually in
# this repo (see playground/README or the root README's "Layered by
# design" section). Build AND the real headless-browser regression suite
# (playground/e2e/regression.mjs) both run on every push/PR as a hard CI
# gate; deploy only runs on a push to main.
#
# Deploys to the gh-pages branch (root), not the actions/deploy-pages
# "environments" flow -- switched deliberately so PR previews
# (deploy-pr-preview.yml) can live alongside the live site as
# gh-pages/pr-<N>/ subdirectories. GitHub Pages only supports one source
# per repo, so this and the PR-preview workflow must agree on the same
# mechanism. Repo Settings -> Pages -> Source must be "Deploy from a
# branch" (gh-pages, /root), not "GitHub Actions".
#
# e2e exists because a typecheck-clean, build-succeeding change reached
# production and broke anyway: a breaking grammar change left every
# returning visitor's saved localStorage content unparseable, surfacing
# a raw parse error on load for text nobody typed that session. Neither
# `tsc --noEmit` nor `vite build` could ever catch that class of bug --
# both only see the bundled example TEXT, never what happens when a real
# browser actually loads the app against realistic (including stale/
# incompatible) persisted state. See regression.mjs's own header comment
# for exactly what it checks and why each check exists.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "playground/**"
      - "*.js"
      - "emitters/**"
      - "math/**"
      - "samples/**"
      - "package.json"
      - "package-lock.json"
      - ".github/scripts/publish-gh-pages.sh"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

# One run per PR / ref; a newer push to a PR cancels that PR's superseded
# run, and runs on main are never cancelled (they queue per ref, so the
# newest main push is the one that ends up published). Pushes to gh-pages
# from this workflow, PR previews and preview cleanup may still happen at
# the same moment; that is handled by the retried push in
# .github/scripts/publish-gh-pages.sh rather than by a shared lock (a lock
# with cancel-in-progress: false keeps only one pending run and would drop
# the others, including a production deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
        working-directory: playground
      - run: npm run build
        working-directory: playground
      - run: npx playwright install --with-deps chromium
        working-directory: playground
      # Hard gate, unconditional (every push AND every PR, not just
      # pushes to main) -- a real regression here must fail CI the same
      # way a broken build already does, long before it's ever a
      # candidate for deploy.
      - run: npm run test:e2e
        working-directory: playground
      # Overlays the build onto the branch root and leaves every pr-<N>/
      # preview directory in place.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          .github/scripts/publish-gh-pages.sh publish playground/dist . "deploy: ${GITHUB_SHA}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
