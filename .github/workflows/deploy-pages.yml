name: Deploy Playground

# The playground (playground/) is a separate subproject -- own
# package.json, own dependencies, "exprforge": "file:.." linking the
# real library so the live demo always reflects whatever's actually in
# this repo (see playground/README or the root README's "Layered by
# design" section). Build AND the real headless-browser regression suite
# (playground/e2e/regression.mjs) both run on every push/PR as a hard CI
# gate; deploy only runs on a push to main, via the modern GitHub-Actions-
# native Pages mechanism (actions/deploy-pages), not a legacy gh-pages
# branch -- and only after e2e passes, not just after the build succeeds.
#
# e2e exists because a typecheck-clean, build-succeeding change reached
# production and broke anyway: a breaking grammar change left every
# returning visitor's saved localStorage content unparseable, surfacing
# a raw parse error on load for text nobody typed that session. Neither
# `tsc --noEmit` nor `vite build` could ever catch that class of bug --
# both only see the bundled example TEXT, never what happens when a real
# browser actually loads the app against realistic (including stale/
# incompatible) persisted state. See regression.mjs's own header comment
# for exactly what it checks and why each check exists.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Only one deployment in flight at a time -- a second push to main
# before the first deploy finishes shouldn't race it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
        working-directory: playground
      - run: npm run build
        working-directory: playground
      - run: npx playwright install --with-deps chromium
        working-directory: playground
      # Hard gate, unconditional (every push AND every PR, not just
      # pushes to main) -- a real regression here must fail CI the same
      # way a broken build already does, long before it's ever a
      # candidate for deploy.
      - run: npm run test:e2e
        working-directory: playground
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
