name: Julia

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!playground/**"
      - "!vscode-extension/**"
      - "!.github/**"
      - ".github/workflows/test-julia.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node --version
      - run: npm ci

      # Exact pin; bump deliberately. No apt package -- confirmed the hard way ("Package julia is not
      # available") that Ubuntu's default repos don't carry one. Same
      # "download a release tarball, add it to PATH" recipe as the
      # QB64/Zig workflows use for the same reason.
      - name: Install Julia
        run: |
          curl -fsSL -o julia.tar.gz "https://julialang-s3.julialang.org/bin/linux/x64/1.11/julia-1.11.5-linux-x86_64.tar.gz"
          tar xzf julia.tar.gz
          echo "$GITHUB_WORKSPACE/julia-1.11.5/bin" >> "$GITHUB_PATH"

      - run: julia --version
      - run: EXPRFORGE_TEST_TARGETS=Julia npm test
