name: C#

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Matrix per Microsoft's .NET support policy
# (https://dotnet.microsoft.com/en-us/platform/support/policy/dotnet-core),
# checked 2026-11-04: .NET 8 (LTS) and .NET 9 (STS) both reach end of support
# on 2026-11-10, leaving .NET 10 (LTS, released 2025-11-11, supported through
# 2028-11-14) as the only supported release. Add .NET 11 once it is generally
# available, and keep the oldest still-supported LTS in the matrix after
# that. The harness targets the
# highest installed SDK major (test/dotnet-tfm.js); EXPRFORGE_DOTNET_TFM pins it.
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["10.0.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node --version
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - run: dotnet --info
      - run: EXPRFORGE_TEST_TARGETS=C# npm test
