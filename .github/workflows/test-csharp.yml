name: C#

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: EXPRFORGE_TEST_TARGETS=C# npm test
