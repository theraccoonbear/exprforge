name: COBOL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!playground/**"
      - "!vscode-extension/**"
      - "!.github/**"
      - ".github/workflows/test-cobol.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node --version
      - run: npm ci
      # gnucobol4 (Ubuntu's default `gnucobol` candidate too) is an
      # early-dev snapshot ("cobc (GnuCOBOL) 4.0-early-dev.0", built 2024
      # from a 2020 package), not a real stable release -- gnucobol3
      # (3.1.2) is, and is also directly installable here. Confirmed via
      # a real CI run that this switch is a safe, non-regressive hygiene
      # improvement (421 tests, 419 pass either way) -- but NOT a fix for
      # comparisonOps/nestedSelect (test/conformance.test.js), which fail
      # identically on both versions with "unknown type name
      # 'cob_decimal'" in cobc's own generated C. That's a real,
      # separate, still-open GnuCOBOL codegen limitation -- see those two
      # samples' own skipTargets: ["COBOL"] comments for the actual
      # pattern (confirmed via real CI runs, not local reproduction,
      # which proved unreliable for this specific question).
      # Series pin (gnucobol3), deliberately not 4.x. To bump: run the full
      # COBOL conformance suite on the new series, re-check the cob_decimal
      # skipTargets samples, and update README "Supported toolchain
      # versions". The runner image (ubuntu-24.04) fixes the exact 3.x patch.
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnucobol3
      - run: cobc --version
      - run: EXPRFORGE_TEST_TARGETS=COBOL npm test
