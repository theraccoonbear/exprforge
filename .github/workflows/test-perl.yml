name: Perl

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node --version
      - run: npm ci
      - run: perl -v # distro perl of the pinned runner image (5.38 on ubuntu-24.04)
      - run: EXPRFORGE_TEST_TARGETS=Perl npm test
