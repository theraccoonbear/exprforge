name: Octave

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Octave
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends octave
      - run: octave-cli --version
      - run: EXPRFORGE_TEST_TARGETS=Octave npm test
