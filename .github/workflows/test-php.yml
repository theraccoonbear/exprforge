name: PHP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install PHP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli
      - run: php --version
      - run: EXPRFORGE_TEST_TARGETS=PHP npm test
