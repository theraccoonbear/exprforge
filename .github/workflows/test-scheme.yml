name: Scheme

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!playground/**"
      - "!vscode-extension/**"
      - "!.github/**"
      - ".github/workflows/test-scheme.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node --version
      - run: npm ci
      - name: Install Guile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y guile-3.0
      # Binary name is NOT consistent across distros -- confirmed the hard
      # way (a first version of this workflow assumed Fedora's "guile3.0"
      # naming and failed here with "command not found") that Ubuntu's
      # guile-3.0 package installs /usr/bin/guile-3.0 (hyphenated), not
      # guile3.0. test/conformance.test.js resolves whichever's actually on
      # PATH at runtime rather than assuming one -- this step just confirms
      # the package landed.
      - run: guile-3.0 --version
      - run: EXPRFORGE_TEST_TARGETS=Scheme npm test
