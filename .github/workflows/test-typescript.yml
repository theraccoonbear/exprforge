name: TypeScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # tsc is a system tool here exactly like gcc/go/rustc/javac -- exprforge
      # only ever generates .ts source text, never executes or type-checks it
      # itself, so this is not a project dependency.
      - name: Install tsc
        run: npm install -g typescript
      - run: EXPRFORGE_TEST_TARGETS=TypeScript npm test
