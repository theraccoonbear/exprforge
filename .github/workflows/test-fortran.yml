name: Fortran

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install gfortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
      - run: gfortran --version
      - run: EXPRFORGE_TEST_TARGETS=Fortran npm test
