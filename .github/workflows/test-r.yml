name: R

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node --version
      - run: npm ci

      # Exact pin; bump deliberately.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"

      - run: Rscript --version
      - run: EXPRFORGE_TEST_TARGETS=R npm test
