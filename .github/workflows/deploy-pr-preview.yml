name: Deploy PR preview

# Each open PR gets a live preview of the playground at
# gh-pages/pr-<N>/, alongside the live site at gh-pages's root
# (deploy-pages.yml) -- see that file's header comment for why both
# share the same gh-pages-branch mechanism rather than PR previews using
# something like actions/deploy-pages independently.
#
# Builds TWICE: once at the standard "/exprforge/" base so
# playground/e2e/regression.mjs (which assumes that exact prefix when
# stripping it to serve dist/ locally) can run unmodified as the same
# hard gate deploy-pages.yml enforces, then again at the PR-specific
# "/exprforge/pr-<N>/" base -- via a direct `vite build` rather than
# `npm run build`, to skip re-running tsc --noEmit -- to produce the
# actual artifact that gets published, since every asset reference in
# the deployed subdirectory needs that prefix or it 404s once live.

on:
  pull_request:
    branches: [main]
    paths:
      - "playground/**"
      - "*.js"
      - "emitters/**"
      - "math/**"
      - "samples/**"
      - "package.json"
      - "package-lock.json"
      - ".github/scripts/publish-gh-pages.sh"
      - ".github/workflows/deploy-pr-preview.yml"
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

# One group per PR, so previews of different PRs build in parallel and a
# newer push (or the close event) cancels that PR's superseded run. The
# gh-pages push itself is made race-safe by the retried push in
# .github/scripts/publish-gh-pages.sh, not by a shared lock.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
        working-directory: playground
      - run: npm run build
        working-directory: playground
      - run: npx playwright install --with-deps chromium
        working-directory: playground
      - run: npm run test:e2e
        working-directory: playground
      - name: Rebuild at PR-specific base path
        run: npx vite build --base=/exprforge/pr-${{ github.event.pull_request.number }}/
        working-directory: playground
      - name: Publish preview
        run: |
          .github/scripts/publish-gh-pages.sh publish playground/dist "pr-${PR_NUMBER}" "chore: deploy preview for PR #${PR_NUMBER}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            🔍 **Playground preview deployed:** https://theraccoonbear.github.io/exprforge/pr-${{ github.event.pull_request.number }}/

            Updates automatically on every push to this PR.

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      # The checkout supplies the publish script from the default branch;
      # the script itself does nothing when gh-pages does not exist yet or
      # this PR never deployed a preview.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Remove preview
        run: |
          .github/scripts/publish-gh-pages.sh remove "pr-${PR_NUMBER}" "chore: remove preview for closed PR #${PR_NUMBER}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            🧹 Playground preview removed (PR closed).
