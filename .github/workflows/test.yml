name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# One job per target language, run in parallel -- they have nothing to do
# with each other, so there's no reason to serialize installing gcc, Go,
# Rust, a JDK, tsc, and building QB64-PE from source (the slowest of the
# lot, at several minutes) into one job like an earlier version of this
# workflow did. Each job installs only its own toolchain and runs
# EXPRFORGE_TEST_TARGETS=<Label> npm test, which the suite
# (test/conformance.test.js) uses to run only that language's checks (plus
# the toolchain-independent JS/reference ones, which every job repeats --
# cheap, and a nice redundant sanity check per job).
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: gcc --version
      - run: EXPRFORGE_TEST_TARGETS=C npm test

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: EXPRFORGE_TEST_TARGETS=Go npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: EXPRFORGE_TEST_TARGETS=Rust npm test

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: EXPRFORGE_TEST_TARGETS=Java npm test

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # tsc is a system tool here exactly like gcc/go/rustc/javac above --
      # exprforge only ever generates .ts source text, never executes or
      # type-checks it itself, so this is not a project dependency.
      - name: Install tsc
        run: npm install -g typescript
      - run: EXPRFORGE_TEST_TARGETS=TypeScript npm test

  qb64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # QB64-PE setup, adapted from a sibling game project's proven CI
      # recipe (Super-Spaceguy-Shooter's .github/workflows/build.yml) --
      # download the latest release, build it locally (its release is a
      # source bundle plus a setup script, not a ready-to-run binary), and
      # cache that build keyed on version so it isn't repeated every run.
      - name: Resolve QB64-PE release version
        id: qb64pe_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_JSON=$(gh api repos/QB64-Phoenix-Edition/QB64pe/releases/latest)
          ASSET_URL=$(echo "$RELEASE_JSON" \
            | python3 -c "import sys,json; assets=json.load(sys.stdin)['assets']; print(next(a['browser_download_url'] for a in assets if 'lnx' in a['name'].lower()))")
          VERSION=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache QB64-PE
        id: cache_qb64pe
        uses: actions/cache@v4
        with:
          path: qb64pe-bin
          key: qb64pe-${{ steps.qb64pe_release.outputs.version }}-${{ runner.os }}

      - name: Install QB64-PE build dependencies
        if: steps.cache_qb64pe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libx11-dev libxext-dev libpng-dev xvfb libcurl4-openssl-dev

      - name: Build QB64-PE
        if: steps.cache_qb64pe.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o qb64pe.tar.gz "${{ steps.qb64pe_release.outputs.asset_url }}"
          tar xzf qb64pe.tar.gz
          cd qb64pe && bash setup_lnx.sh 1 && cd ..
          mv qb64pe qb64pe-bin

      # Puts `qb64pe` on PATH as a bare command, matching how the test
      # suite invokes it (same convention as gcc/go/rustc/javac/tsc above).
      - name: Add QB64-PE to PATH
        run: echo "$GITHUB_WORKSPACE/qb64pe-bin" >> "$GITHUB_PATH"

      - run: EXPRFORGE_TEST_TARGETS=QB64 npm test

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: EXPRFORGE_TEST_TARGETS=C# npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: EXPRFORGE_TEST_TARGETS=Python npm test

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
      - run: EXPRFORGE_TEST_TARGETS=Lua npm test

  all-green:
    name: All language checks pass
    needs: [c, go, rust, java, typescript, qb64, csharp, python, lua]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require every job to have succeeded
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = [name for name, info in needs.items() if info['result'] != 'success']
          if bad:
              print('FAILED jobs:', ', '.join(bad))
              sys.exit(1)
          print('All language jobs passed.')
          "
